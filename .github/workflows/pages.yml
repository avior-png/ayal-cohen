# בנייה סטטית ופרסום ל-GitHub Pages דרך ענף gh-pages.
#
# הכתובת: https://<owner>.github.io/<repo>/
# ה-BASE_PATH נגזר אוטומטית מ-GITHUB_REPOSITORY בתוך
# scripts/build-static.mjs — אין מה להגדיר ידנית.
#
# ⚠️  למה דחיפה לענף ולא ‎actions/deploy-pages‎:
#     הפעולות הרשמיות קוראות ל-Pages API, ו-GITHUB_TOKEN של ריצת
#     Actions אינו מורשה **ליצור** את אתר ה-Pages —
#     "Resource not accessible by integration". דחיפה לענף עוברת
#     ב-‎contents: write‎ הרגיל, וההגדרה היחידה שנדרשת פעם אחת היא
#     בחירת הענף ב-Settings → Pages.
#
# ⚠️  זו פריסה **סטטית**: אין מערכת ניהול ואין כתיבה למסד, וטופס
#     יצירת הקשר פותח וואטסאפ עם הפרטים במקום לשמור אותם.
#     הפריסה המלאה (Vercel + Postgres) מתועדת ב-docs/DEPLOY.md.
name: Pages

on:
  push:
    branches: [claude/trusting-rubin-a6o6ca]
  workflow_dispatch:

permissions:
  contents: write

# פרסום אחד בכל רגע; ריצה חדשה לא מבטלת פרסום שכבר התחיל.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ה-postinstall מריץ prisma generate, שדורש את הסכמה בלבד
      # ולא מסד חי.
      - run: npm ci

      - run: npm run build:static

      # קומיט יחיד ללא היסטוריה בכל פרסום: ענף התוצר לא צריך
      # היסטוריה, והיא הייתה מנפחת את המאגר בכל בנייה.
      - name: פרסום ל-gh-pages
        run: |
          set -e
          cd out
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פרסום מ-${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
