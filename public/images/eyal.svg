<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="שמורת מקום לתצלום דיוקן">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#153F69"/><stop offset="0.5" stop-color="#0A2748"/><stop offset="1" stop-color="#061527"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C879"/><stop offset="1" stop-color="#B0801F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#B0801F" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#B0801F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0V50M0 50H50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- טבעות זהב — הרמז הגרפי היחיד, כדי שהמקום שמור לתצלום ולא מתחרה בו -->
  <g fill="none" stroke-linecap="round">
    <circle cx="400" cy="500" r="300" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="400" cy="500" r="232" stroke="#ffffff" stroke-opacity="0.09"/>
    <path d="M400 200a300 300 0 0 1 212 88" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M168 500a232 232 0 0 1 68-164" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.55"/>
  </g>

  <!-- סמל המותג במרכז, בקנה מידה מאופק -->
  <g transform="translate(400 500) scale(3.6) translate(-22 -22)">
    <path d="M22 2.6 40 11.2v12.4c0 9.6-7.6 15.6-18 18.8C11.6 39.2 4 33.2 4 23.6V11.2L22 2.6Z"
          fill="#ffffff" fill-opacity="0.05" stroke="url(#gold)" stroke-opacity="0.75" stroke-width="0.8"/>
    <path d="M12.5 28.5 18.6 22.2l4.7 4 7.6-9" fill="none" stroke="url(#gold)"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30.9" cy="17.2" r="2.3" fill="url(#gold)"/>
  </g>

  <rect x="0" y="988" width="800" height="12" fill="url(#gold)"/>
</svg>
